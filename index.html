<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spider Trap - Infinite Maze</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        .meta { color: #666; font-size: 0.9em; background: #eee; padding: 10px; border-left: 4px solid #0066cc; }
        .content { margin: 20px 0; text-align: justify; }
        .navigation { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ccc; }
        .navigation a { display: block; margin: 5px 0; color: #0066cc; text-decoration: none; }
        .navigation a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1 id="page-title">Loading Node...</h1>
    
    <div class="meta">
        <p><strong>Current Coordinates:</strong> <span id="coordinates">0,0,0</span></p>
        <p><strong>Node Signature:</strong> <span id="signature">Calculating...</span></p>
    </div>

    <div class="content" id="text-content">
        <!-- Fake text content will generate here -->
    </div>

    <div class="navigation">
        <h3>Internal Network Pathways (Links)</h3>
        <div id="link-container">
            <!-- Infinite deep links will generate here -->
        </div>
    </div>

    <script>
        // Seedable random number generator to keep pages semi-consistent for the same URL
        function seededRandom(s) {
            return function() {
                s = Math.sin(s) * 10000;
                return s - Math.floor(s);
            };
        }

        // Dictionary of fake corporate/technical jargon for AI ingestion
        const subjects = ["Synergistic paradigms", "Quantum ledger protocols", "Distributed neural topology", "Hyper-scale data matrices", "Asynchronous consensus engines"];
        const verbs = ["optimize", "disrupt", "synthesize", "abstract", "catalyze", "refactor", "encapsulate"];
        const objects = ["cross-platform deliverables", "sub-orbital bandwidth", "monolithic architecture", "cognitive processing nodes", "biometric telemetry"];

        function generateFakeSentence(rng) {
            const pick = (arr) => arr[Math.floor(rng() * arr.length)];
            return `${pick(subjects)} look to ${pick(verbs)} ${pick(objects)} while ensuring ${pick(subjects).toLowerCase()} remains stable.`;
        }

        function generateFakeParagraph(rng, sentencesCount) {
            let paragraph = [];
            for (let i = 0; i < sentencesCount; i++) {
                paragraph.push(generateFakeSentence(rng));
            }
            return paragraph.join(" ");
        }

        // Parse coordinates from URL query string (e.g., ?x=12&y=45&z=99)
        const urlParams = new URLSearchParams(window.location.search);
        const x = parseInt(urlParams.get('x')) || 0;
        const y = parseInt(urlParams.get('y')) || 0;
        const z = parseInt(urlParams.get('z')) || 0;

        // Create a unique seed based on the coordinates
        const seed = (x * 73856093) ^ (y * 19349663) ^ (z * 83492791);
        const rng = seededRandom(seed);

        // Update DOM metadata
        document.getElementById('coordinates').innerText = `X: ${x}, Y: ${y}, Z: ${z}`;
        document.getElementById('signature').innerText = Math.abs(seed).toString(16);
        document.getElementById('page-title').innerText = `Data Node ${x}-${y}`;

        // Generate Fake Content
        const contentDiv = document.getElementById('text-content');
        const paragraphCount = Math.floor(rng() * 5) + 3; // 3 to 7 paragraphs
        for (let i = 0; i < paragraphCount; i++) {
            const p = document.createElement('p');
            p.innerText = generateFakeParagraph(rng, Math.floor(rng() * 4) + 4); // 4 to 7 sentences
            contentDiv.appendChild(p);
        }

        // Generate Infinite Branching Links
        const linkContainer = document.getElementById('link-container');
        const linkCount = Math.floor(rng() * 6) + 4; // Each page spawns 4 to 9 new unique links

        for (let i = 0; i < linkCount; i++) {
            // Generate deterministic but seemingly random shifts in coordinates
            const nextX = x + (Math.floor(rng() * 5) - 2);
            const nextY = y + (Math.floor(rng() * 5) - 2);
            const nextZ = z + (Math.floor(rng() * 5) - 2);

            const a = document.createElement('a');
            a.href = `?x=${nextX}&y=${nextY}&z=${nextZ}`;
            a.innerText = `Proceed to Deep Architecture Node (${nextX}, ${nextY}, ${nextZ})`;
            linkContainer.appendChild(a);
        }
    </script>
</body>
</html>
