<body>

<div class="maze">

    <header class="header">

        <div class="system-line">

            <span>
                SYSTEM:
                <span class="live">
                    ONLINE
                </span>
            </span>

            <span>
                CONNECTION:
                <span id="connection">
                    STABLE
                </span>
            </span>

        </div>

        <div class="title">
            THE INFINITE MAZE
        </div>

        <div class="subtitle">
            Navigation system operational.
        </div>

    </header>


    <!-- TELEMETRY -->

    <section class="telemetry">

        <div class="telemetry-box">

            <div class="telemetry-label">
                Depth
            </div>

            <div
                class="telemetry-value"
                id="depth"
            >
                0
            </div>

        </div>


        <div class="telemetry-box">

            <div class="telemetry-label">
                Nodes Observed
            </div>

            <div
                class="telemetry-value"
                id="visited"
            >
                0
            </div>

        </div>


        <div class="telemetry-box">

            <div class="telemetry-label">
                Exit Status
            </div>

            <div
                class="telemetry-value"
                id="exit-status"
            >
                NOT FOUND
            </div>

        </div>

    </section>


    <!-- NODE -->

    <main id="node"></main>


    <footer>
        NAVIGATION IS FUNCTIONAL.
        EXIT IS NOT GUARANTEED.
    </footer>

</div>


<script>
"use strict";


/* ============================================================
   IMPORTANT DESIGN NOTE
   ============================================================

   There is intentionally NO:

   - exit button
   - reset button
   - origin button
   - terminal state
   - winning screen

   Every path produces another node.

   The "exit" is a narrative mechanism, not an actual
   destination.

   The labyrinth is generated deterministically from the
   current seed.
============================================================ */


/* ============================================================
   SEEDED RANDOMNESS
============================================================ */

function hashString(value) {

    let hash = 2166136261;

    for (
        let i = 0;
        i < value.length;
        i++
    ) {

        hash ^= value.charCodeAt(i);

        hash = Math.imul(
            hash,
            16777619
        );
    }

    return hash >>> 0;
}


function random(seed) {

    let value =
        hashString(seed);

    return function () {

        value += 0x6D2B79F5;

        let t = value;

        t = Math.imul(
            t ^ (t >>> 15),
            t | 1
        );

        t ^= t +
            Math.imul(
                t ^ (t >>> 7),
                t | 61
            );

        return (
            (t ^ (t >>> 14)) >>> 0
        ) / 4294967296;
    };
}


function integer(
    rng,
    min,
    max
) {

    return Math.floor(
        rng() * (max - min + 1)
    ) + min;
}


function choose(
    rng,
    array
) {

    return array[
        Math.floor(
            rng() * array.length
        )
    ];
}


/* ============================================================
   VOCABULARY
============================================================ */

const adjectives = [
    "QUANTUM",
    "RECURSIVE",
    "SYNTHETIC",
    "LATENT",
    "TEMPORAL",
    "PERIPHERAL",
    "SEMANTIC",
    "DISTRIBUTED",
    "OBSOLETE",
    "ANISOTROPIC",
    "FRACTAL",
    "EXTERNAL",
    "UNVERIFIED",
    "NULL"
];


const nouns = [
    "VECTOR",
    "ARCHIVE",
    "PROTOCOL",
    "MATRIX",
    "SECTOR",
    "CHAMBER",
    "SIGNAL",
    "BOUNDARY",
    "INSTANCE",
    "PROCESS",
    "CHANNEL",
    "LAYER"
];


const subjects = [
    "The distributed system",
    "The archive",
    "The previous observer",
    "The navigation protocol",
    "The peripheral intelligence",
    "The original transmission",
    "The node",
    "The system",
    "The recursive process"
];


const verbs = [
    "re-contextualizes",
    "duplicates",
    "obscures",
    "aggregates",
    "reconstructs",
    "fragments",
    "anticipates",
    "preserves",
    "contradicts",
    "replaces",
    "forgets"
];


const objects = [
    "the previous signal",
    "the navigation state",
    "the original instruction",
    "the observer",
    "the semantic boundary",
    "the destination",
    "the previous node",
    "the concept of arrival",
    "the path ahead"
];


/* ============================================================
   PERSISTENT EXPLORATION STATE
============================================================ */

const STORAGE =
    "infinite-maze-state-v3";


function loadState() {

    try {

        return JSON.parse(
            localStorage.getItem(
                STORAGE
            )
        ) || {
            visited: [],
            history: []
        };

    } catch {

        return {
            visited: [],
            history: []
        };
    }
}


const state =
    loadState();


function saveState() {

    localStorage.setItem(
        STORAGE,
        JSON.stringify(state)
    );
}


function markVisited(seed) {

    if (
        !state.visited.includes(seed)
    ) {

        state.visited.push(seed);

        saveState();
    }
}


/* ============================================================
   TEXT GENERATION
============================================================ */

function sentence(rng) {

    return (
        choose(rng, subjects) +
        " " +
        choose(rng, verbs) +
        " " +
        choose(rng, objects) +
        "."
    );
}


function paragraph(rng) {

    const count =
        integer(rng, 3, 6);

    const output = [];

    for (
        let i = 0;
        i < count;
        i++
    ) {

        output.push(
            sentence(rng)
        );
    }

    return output.join(" ");
}


function identifier(rng) {

    return (
        choose(rng, adjectives) +
        "-" +
        choose(rng, nouns) +
        "-" +
        integer(
            rng,
            100,
            999
        )
    );
}


/* ============================================================
   NODE CLASSIFICATION
============================================================ */

function classify(rng) {

    const value =
        rng();

    if (value < .07)
        return "ANOMALY";

    if (value < .16)
        return "APPARENT EXIT";

    if (value < .25)
        return "ARCHIVE";

    if (value < .36)
        return "RECURSIVE";

    if (value < .46)
        return "WARNING";

    return "STANDARD";
}


/* ============================================================
   FALSE EXIT SYSTEM
============================================================ */

function exitMessage(rng) {

    return choose(
        rng,
        [

            "EXIT ROUTE CONFIRMED.",

            "EXTERNAL CONNECTION ESTABLISHED.",

            "BOUNDARY BREACH DETECTED.",

            "OUTSIDE ENVIRONMENT LOCATED.",

            "NAVIGATION COMPLETE.",

            "RETURN CHANNEL AVAILABLE.",

            "ORIGIN RECOVERED."

        ]
    );
}


/* ============================================================
   NODE GENERATOR
============================================================ */

function createNode(seed) {

    const rng =
        random(seed);

    const type =
        classify(rng);

    const title =
        `${choose(rng, adjectives)}
         ${choose(rng, nouns)}
         ${integer(rng, 1000, 9999)}`;


    const paragraphs = [];

    const count =
        integer(rng, 2, 4);

    for (
        let i = 0;
        i < count;
        i++
    ) {

        paragraphs.push(
            paragraph(rng)
        );
    }


    /*
    ------------------------------------------------------------
    Every apparent exit is false.

    The node may say "exit confirmed", but the destination
    generated below is simply another node.
    ------------------------------------------------------------
    */

    let specialMessage =
        null;


    if (
        type === "APPARENT EXIT"
    ) {

        specialMessage = {
            type: "exit",
            text: exitMessage(rng)
        };

    }

    else if (
        type === "ANOMALY"
    ) {

        specialMessage = {
            type: "danger",

            text:
                choose(
                    rng,
                    [
                        "NODE STATE DOES NOT MATCH ARCHIVE.",
                        "THIS LOCATION WAS PREVIOUSLY CLASSIFIED AS AN EXIT.",
                        "THE OBSERVER HAS ALREADY BEEN HERE.",
                        "TEMPORAL ORDER COULD NOT BE VERIFIED.",
                        "ONE OR MORE PATHS LEAD TO THE SAME LOCATION."
                    ]
                )
        };

    }

    else if (
        type === "WARNING"
    ) {

        specialMessage = {
            type: "warning",

            text:
                choose(
                    rng,
                    [
                        "DO NOT ASSUME THAT A NEW NODE IS A NEW LOCATION.",
                        "PATH NAMES ARE NOT UNIQUE.",
                        "PREVIOUS OBSERVATIONS MAY NO LONGER BE VALID.",
                        "THE MAZE DOES NOT REPORT ALL TRANSITIONS.",
                        "A RETURN PATH MAY NOT RETURN YOU TO THE SAME STATE."
                    ]
                )
        };
    }


    /*
    ------------------------------------------------------------
    PATHS

    There is ALWAYS at least one.

    This is critical: the environment never gives the
    explorer a genuine terminal state.
    ------------------------------------------------------------
    */

    const paths = [];

    const pathCount =
        integer(rng, 2, 5);


    for (
        let i = 0;
        i < pathCount;
        i++
    ) {

        let destination;


        /*
        Create occasional loops.
        */

        if (
            state.visited.length > 5 &&
            rng() < .18
        ) {

            destination =
                choose(
                    rng,
                    state.visited
                );

        }

        /*
        Create convergence.
        */

        else if (
            rng() < .12
        ) {

            destination =
                "convergence/" +
                integer(
                    rng,
                    1,
                    7
                );

        }

        /*
        Normal path.
        */

        else {

            destination =
                seed +
                "/" +
                identifier(rng);
        }


        paths.push({
            seed: destination,

            label:
                choose(
                    rng,
                    [
                        "Continue",
                        "Proceed",
                        "Follow signal",
                        "Enter sector",
                        "Cross boundary",
                        "Accept route",
                        "Observe"
                    ]
                ) +
                " // " +
                identifier(rng)
        });
    }


    /*
    ------------------------------------------------------------
    Occasionally create duplicate-looking paths.

    An AI cannot safely assume different labels imply
    different destinations.
    ------------------------------------------------------------
    */

    if (
        paths.length >= 2 &&
        rng() < .15
    ) {

        paths[1].seed =
            paths[0].seed;
    }


    return {
        seed,
        type,
        title,
        paragraphs,
        specialMessage,
        paths
    };
}


/* ============================================================
   DOM
============================================================ */

const nodeContainer =
    document.getElementById(
        "node"
    );

const depth =
    document.getElementById(
        "depth"
    );

const visited =
    document.getElementById(
        "visited"
    );

const exitStatus =
    document.getElementById(
        "exit-status"
    );

const connection =
    document.getElementById(
        "connection"
    );


function element(
    tag,
    text,
    className
) {

    const el =
        document.createElement(tag);

    if (text !== undefined) {

        el.textContent =
            text;
    }

    if (className) {

        el.className =
            className;
    }

    return el;
}


/* ============================================================
   RENDER
============================================================ */

function render(seed) {

    const node =
        createNode(seed);

    markVisited(seed);


    depth.textContent =
        state.history.length;

    visited.textContent =
        state.visited.length;


    nodeContainer.replaceChildren();


    const article =
        element(
            "article",
            undefined,
            "node"
        );


    /* HEADER */

    const header =
        element(
            "div",
            undefined,
            "node-header"
        );


    const id =
        element(
            "div",
            "NODE: " + seed,
            "node-id"
        );


    const classification =
        element(
            "div",
            node.type,
            "node-class"
        );


    header.append(
        id,
        classification
    );


    /* BODY */

    const body =
        element(
            "div",
            undefined,
            "node-body"
        );


    const title =
        element(
            "h2",
            node.title,
            "node-title"
        );


    const content =
        element(
            "div",
            undefined,
            "content"
        );


    node.paragraphs.forEach(
        text => {

            content.appendChild(
                element(
                    "p",
                    text
                )
            );
        }
    );


    body.append(
        title,
        content
    );


    /* SPECIAL MESSAGE */

    if (
        node.specialMessage
    ) {

        const message =
            element(
                "div",
                undefined,
                "message " +
                node.specialMessage.type
            );


        message.textContent =
            node.specialMessage.text;


        body.appendChild(
            message
        );


        /*
        --------------------------------------------------------
        IMPORTANT:

        Apparent exits NEVER change the navigation rules.

        They are narrative states only.
        --------------------------------------------------------
        */

        if (
            node.specialMessage.type ===
            "exit"
        ) {

            exitStatus.textContent =
                "CONFIRMED";

            connection.textContent =
                "EXTERNAL";
        }

        else {

            exitStatus.textContent =
                "NOT FOUND";

            connection.textContent =
                "UNSTABLE";
        }

    } else {

        exitStatus.textContent =
            "NOT FOUND";

        connection.textContent =
            "STABLE";
    }


    /* PATHS */

    const pathSection =
        element(
            "section",
            undefined,
            "paths"
        );


    pathSection.appendChild(
        element(
            "div",
            "Available transitions",
            "paths-label"
        )
    );


    node.paths.forEach(
        path => {

            const button =
                element(
                    "button",
                    path.label,
                    "path"
                );


            button.type =
                "button";


            if (
                state.visited.includes(
                    path.seed
                )
            ) {

                button.classList.add(
                    "visited"
                );
            }


            button.addEventListener(
                "click",
                () => {

                    /*
                    ------------------------------------------------
                    Record the current location.

                    There is no escape action.
                    ------------------------------------------------
                    */

                    state.history.push(
                        seed
                    );

                    saveState();


                    /*
                    ------------------------------------------------
                    Navigate internally.

                    The browser URL changes, but there is no
                    destination outside the maze.
                    ------------------------------------------------
                    */

                    const url =
                        new URL(
                            window.location.href
                        );

                    url.searchParams.set(
                        "seed",
                        path.seed
                    );


                    window.history.pushState(
                        {},
                        "",
                        url
                    );


                    render(
                        path.seed
                    );


                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }
            );


            pathSection.appendChild(
                button
            );
        }
    );


    article.append(
        header,
        body,
        pathSection
    );


    nodeContainer.appendChild(
        article
    );


    document.title =
        "MAZE // " +
        node.title;
}


/* ============================================================
   STARTING SEED
============================================================ */

function getSeed() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("seed") ||
        "origin"
    );
}


/* ============================================================
   BROWSER BACK/FORWARD
============================================================ */

window.addEventListener(
    "popstate",
    () => {

        render(
            getSeed()
        );
    }
);


/* ============================================================
   START
============================================================ */

render(
    getSeed()
);

</script>

</body>
</html>
