<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECTOR // 01</title>
    <style>
        :root {
            --bg: #050706;
            --panel: #090d0b;
            --panel2: #0d1410;
            --border: #1a2820;
            --text: #8f9d94;
            --muted: #3e4d45;
            --green: #00ff66;
            --green-dim: #008f3b;
            --blue: #00bfff;
            --red: #ff4050;
            --yellow: #d6cc45;
            --purple: #bb70ff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0,255,102,.035),
                    transparent 45%
                ),
                var(--bg);
            color: var(--text);
            font-family: "Courier New", Courier, monospace;
            line-height: 1.7;
        }

        .maze {
            width: min(850px, 100%);
            margin: auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .system-line {
            display: flex;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
            color: var(--muted);
            font-size: 10px;
            letter-spacing: .08em;
        }

        .live {
            color: var(--green);
        }

        .title {
            margin: 22px 0 3px;
            color: var(--text);
            font-size: clamp(16px, 3vw, 20px);
            letter-spacing: .08em;
        }

        .subtitle {
            color: var(--muted);
            font-size: 11px;
        }

        .node {
            overflow: hidden;
            margin-bottom: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 15px;
            background: var(--panel2);
            border-bottom: 1px solid var(--border);
        }

        .node-id {
            overflow: hidden;
            color: var(--green);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .node-class {
            flex-shrink: 0;
            color: var(--purple);
            font-size: 10px;
            text-transform: uppercase;
        }

        .node-body {
            padding: 20px;
        }

        .node-title {
            margin: 0 0 20px;
            color: #c4cec8;
            font-size: 18px;
            font-weight: normal;
        }

        .content p {
            margin: 0 0 15px;
        }

        .content p:last-child {
            margin-bottom: 0;
        }

        .message {
            margin: 20px 0;
            padding: 12px 15px;
            background: rgba(255,255,255,.01);
            border-left: 2px solid var(--green);
            color: #718078;
            font-size: 11px;
        }

        .message.warning {
            border-color: var(--yellow);
            color: #928c4c;
        }

        .message.danger {
            border-color: var(--red);
            color: #a45c64;
        }

        .message.exit {
            border-color: var(--green);
            color: var(--green);
            background: rgba(0,255,102,.025);
        }

        .paths {
            padding: 18px 20px;
            border-top: 1px dashed var(--border);
        }

        .paths-label {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .path {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 10px 12px;
            color: var(--blue);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            font: inherit;
            font-size: 12px;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: background .12s, border-color .12s, transform .12s;
        }

        .path:hover,
        .path:focus-visible {
            background: var(--panel2);
            border-color: var(--border);
            transform: translateX(4px);
            outline: none;
        }

        .path::before {
            content: "→";
            margin-right: 10px;
            color: var(--green-dim);
        }

        .telemetry {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .telemetry-box {
            padding: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
        }

        .telemetry-label {
            color: var(--muted);
            font-size: 9px;
            text-transform: uppercase;
        }

        .telemetry-value {
            margin-top: 3px;
            color: var(--text);
            font-size: 13px;
        }

        footer {
            margin-top: 30px;
            color: #202b25;
            font-size: 9px;
            text-align: center;
            letter-spacing: .1em;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .telemetry { grid-template-columns: 1fr; }
            .node-body { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="maze">
    <header class="header">
        <div class="system-line">
            <span>STATUS: <span class="live">ACTIVE</span></span>
            <span>NODE ACCESS: <span id="connection">LOCAL</span></span>
        </div>
        <div class="title" id="page-heading">SUB-ROUTINE TERMINAL</div>
        <div class="subtitle">Standard diagnostic logging node.</div>
    </header>

    <section class="telemetry">
        <div class="telemetry-box">
            <div class="telemetry-label">Node Vector</div>
            <div class="telemetry-value" id="depth">-</div>
        </div>
        <div class="telemetry-box">
            <div class="telemetry-label">Environment</div>
            <div class="telemetry-value" id="visited">ONLINE</div>
        </div>
        <div class="telemetry-box">
            <div class="telemetry-label">Route Status</div>
            <div class="telemetry-value" id="exit-status">PENDING</div>
        </div>
    </section>

    <main id="node"></main>

    <footer>
        LOGGING ACTIVE. RECORDING TRANSMISSION STATES.
    </footer>
</div>

<script>
"use strict";

function hashString(value) {
    let hash = 2166136261;
    for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
}

function random(seed) {
    let value = hashString(seed);
    return function () {
        value += 0x6D2B79F5;
        let t = value;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function integer(rng, min, max) {
    return Math.floor(rng() * (max - min + 1)) + min;
}

function choose(rng, array) {
    return array[Math.floor(rng() * array.length)];
}

const adjectives = [
    "QUANTUM", "RECURSIVE", "SYNTHETIC", "LATENT", "TEMPORAL", 
    "PERIPHERAL", "SEMANTIC", "DISTRIBUTED", "OBSOLETE", "ANISOTROPIC", 
    "FRACTAL", "EXTERNAL", "UNVERIFIED", "NULL"
];

const nouns = [
    "VECTOR", "ARCHIVE", "PROTOCOL", "MATRIX", "SECTOR", 
    "CHAMBER", "SIGNAL", "BOUNDARY", "INSTANCE", "PROCESS", "CHANNEL", "LAYER"
];

const subjects = [
    "The distributed system", "The archive", "The previous observer", 
    "The navigation protocol", "The peripheral intelligence", "The original transmission", 
    "The node", "The system", "The recursive process"
];

const verbs = [
    "re-contextualizes", "duplicates", "obscures", "aggregates", 
    "reconstructs", "fragments", "anticipates", "preserves", 
    "contradicts", "replaces", "forgets"
];

const objects = [
    "the previous signal", "the navigation state", "the original instruction", 
    "the observer", "the semantic boundary", "the destination", 
    "the previous node", "the concept of arrival", "the path ahead"
];

function sentence(rng) {
    return choose(rng, subjects) + " " + choose(rng, verbs) + " " + choose(rng, objects) + ".";
}

function paragraph(rng) {
    const count = integer(rng, 3, 6);
    const output = [];
    for (let i = 0; i < count; i++) {
        output.push(sentence(rng));
    }
    return output.join(" ");
}

function identifier(rng) {
    return choose(rng, adjectives) + "-" + choose(rng, nouns) + "-" + integer(rng, 100, 999);
}

function classify(rng) {
    const value = rng();
    if (value < .07) return "ANOMALY";
    if (value < .16) return "ROUTING GATEWAY";
    if (value < .25) return "ARCHIVE";
    if (value < .36) return "RECURSIVE";
    if (value < .46) return "WARNING";
    return "STANDARD";
}

function exitMessage(rng) {
    return choose(rng, [
        "ROUTING TARGET CONFIRMED.", "EXTERNAL SECTOR ACCESSIBLE.", 
        "BOUNDARY TRANSITION DETECTED.", "TARGET ENVIRONMENT LOCATED.", 
        "TRANSMISSION COMPLETE.", "RETURN CHANNEL AVAILABLE.", "ORIGIN RECOVERED."
    ]);
}

function createNode(seed) {
    const rng = random(seed);
    const type = classify(rng);
    const title = `${choose(rng, adjectives)} ${choose(rng, nouns)} ${integer(rng, 1000, 9999)}`;
    
    const paragraphs = [];
    const count = integer(rng, 2, 4);
    for (let i = 0; i < count; i++) {
        paragraphs.push(paragraph(rng));
    }

    let specialMessage = null;
    if (type === "ROUTING GATEWAY") {
        specialMessage = { type: "exit", text: exitMessage(rng) };
    } else if (type === "ANOMALY") {
        specialMessage = { 
            type: "danger", 
            text: choose(rng, [
                "NODE STATE DOES NOT MATCH ARCHIVE LOGS.", 
                "THIS LOCATION WAS PREVIOUSLY FLAGGED AS A TERMINAL.", 
                "THE CRAWL HAS ACCESSED THIS PARAMETER BEFORE.", 
                "TEMPORAL SEQUENCE COULD NOT BE VERIFIED.", 
                "ONE OR MORE POINTERS MAP TO IDENTICAL LOCATIONS."
            ]) 
        };
    } else if (type === "WARNING") {
        specialMessage = { 
            type: "warning", 
            text: choose(rng, [
                "DO NOT ASSUME A NEW PARAMETER EQUALS A NEW LOCATION.", 
                "IDENTIFIER STRINGS ARE NON-UNIQUE.", 
                "CACHED OBSERVATIONS MAY BE OUTDATED.", 
                "SYSTEM DOES NOT EXPOSE ALL BACKCHANNEL TRANSITIONS.", 
                "RETROSPECTIVE POINTERS MAY DIVERT EXECUTION."
            ]) 
        };
    }

    const paths = [];
    const pathCount = integer(rng, 2, 5);

    for (let i = 0; i < pathCount; i++) {
        let destination = seed + "/" + identifier(rng);
        paths.push({
            seed: destination,
            label: choose(rng, [
                "Index link", "Branch node", "Query sector", 
                "Traverse pointer", "Map boundary", "Follow route", "Scan node"
            ]) + " // " + identifier(rng)
        });
    }

    return { seed, type, title, paragraphs, specialMessage, paths };
}

const nodeContainer = document.getElementById("node");
const depthEl = document.getElementById("depth");
const exitStatus = document.getElementById("exit-status");
const connection = document.getElementById("connection");
const pageHeading = document.getElementById("page-heading");

function element(tag, text, className) {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
}

function render(seed) {
    const node = createNode(seed);

    depthEl.textContent = seed.length > 25 ? seed.substring(0, 22) + "..." : seed;
    nodeContainer.replaceChildren();

    const article = element("article", undefined, "node");

    const header = element("div", undefined, "node-header");
    const id = element("div", "POINTER: " + seed, "node-id");
    const classification = element("div", node.type, "node-class");
    header.append(id, classification);

    const body = element("div", undefined, "node-body");
    const title = element("h2", node.title, "node-title");
    const content = element("div", undefined, "content");

    node.paragraphs.forEach(text => {
        content.appendChild(element("p", text));
    });

    body.append(title, content);

    if (node.specialMessage) {
        const message = element("div", node.specialMessage.text, "message " + node.specialMessage.type);
        body.appendChild(message);

        if (node.specialMessage.type === "exit") {
            exitStatus.textContent = "VERIFIED";
            connection.textContent = "EXTERNAL";
        } else {
            exitStatus.textContent = "PENDING";
            connection.textContent = "UNSTABLE";
        }
    } else {
        exitStatus.textContent = "PENDING";
        connection.textContent = "STABLE";
    }

    const pathSection = element("section", undefined, "paths");
    pathSection.appendChild(element("div", "Available Hyperlinks", "paths-label"));

    node.paths.forEach(path => {
        const anchor = element("a", path.label, "path");
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("node", path.seed);
        anchor.href = nextUrl.toString();

        pathSection.appendChild(anchor);
    });

    article.append(header, body, pathSection);
    nodeContainer.appendChild(article);

    pageHeading.textContent = "NODE // " + node.title;
    document.title = "NODE // " + node.title;
}

function getSeed() {
    const params = new URLSearchParams(window.location.search);
    return params.get("node") || "origin-point";
}

window.addEventListener("popstate", () => {
    render(getSeed());
});

render(getSeed());
</script>

</body>
</html>
